<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c222e" />
      <stop offset="100%" stop-color="#12151b" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4b63" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f2633" stop-opacity="0.4" />
    </linearGradient>

    <!-- Spectral Aperture Blade Gradients -->
    <linearGradient id="bladeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="bladeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979FF" />
      <stop offset="100%" stop-color="#3D5AFE" />
    </linearGradient>

    <linearGradient id="bladePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#651FFF" />
    </linearGradient>

    <linearGradient id="bladeMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#FF4081" />
    </linearGradient>

    <linearGradient id="bladeCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>

    <linearGradient id="bladeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Central Lens Shadow & Glow -->
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="85%" stop-color="#141824" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Tile Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Framing / Focal Brackets (Studio Precision) -->
  <path d="M 64 104 L 64 64 L 104 64" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M 448 408 L 448 448 L 408 448" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Aperture Blades Group -->
  <g transform="translate(256, 256)">
    <!-- Blade 1: Cyan -->
    <path d="M 0,-155 C 60,-155 120,-110 145,-55 L 48,-18 C 36,-45 15,-60 0,-62 Z" fill="url(#bladeCyan)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- Blade 2: Blue -->
    <g transform="rotate(60)">
      <path d="M 0,-155 C 60,-155 120,-110 145,-55 L 48,-18 C 36,-45 15,-60 0,-62 Z" fill="url(#bladeBlue)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
    </g>

    <!-- Blade 3: Purple -->
    <g transform="rotate(120)">
      <path d="M 0,-155 C 60,-155 120,-110 145,-55 L 48,-18 C 36,-45 15,-60 0,-62 Z" fill="url(#bladePurple)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
    </g>

    <!-- Blade 4: Magenta -->
    <g transform="rotate(180)">
      <path d="M 0,-155 C 60,-155 120,-110 145,-55 L 48,-18 C 36,-45 15,-60 0,-62 Z" fill="url(#bladeMagenta)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
    </g>

    <!-- Blade 5: Coral -->
    <g transform="rotate(240)">
      <path d="M 0,-155 C 60,-155 120,-110 145,-55 L 48,-18 C 36,-45 15,-60 0,-62 Z" fill="url(#bladeCoral)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
    </g>

    <!-- Blade 6: Amber -->
    <g transform="rotate(300)">
      <path d="M 0,-155 C 60,-155 120,-110 145,-55 L 48,-18 C 36,-45 15,-60 0,-62 Z" fill="url(#bladeAmber)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" />
    </g>

    <!-- Center Lens Core -->
    <circle cx="0" cy="0" r="56" fill="url(#lensCore)" stroke="#00E5FF" stroke-width="3" />

    <!-- Lens Reflection Arc -->
    <path d="M -35,-20 A 40 40 0 0 1 25,-32" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Central Prism Sparkle -->
    <circle cx="16" cy="-16" r="6" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="16" cy="-16" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
