name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.15.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Install WiX Toolset v5 & Extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2 WixToolset.BootstrapperApplications.wixext/5.0.2
          wix --version

      - name: Run Validation Checks
        shell: pwsh
        run: |
          cargo check -p photocraft -p photocraft-cli
          cargo test -p photocraft-ui-egui --lib

      - name: Build and Package Windows Release
        shell: pwsh
        env:
          PHOTOCRAFT_VERSION: ${{ inputs.version }}
        run: |
          pwsh packaging/windows/package.ps1 -Arch x64

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $dist = "dist/release"
          Get-ChildItem -Path $dist -File -Include *.msi, *.zip, *.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "$dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "Pixora Studio ${{ inputs.version || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            dist/release/*-installer.exe
            dist/release/*.msi
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          body: |
            ## Pixora Studio — Professional Photo Editing. Free for Everyone.

            **Publisher:** IT Amadersomaj Inc.
            **Release:** ${{ inputs.version || github.ref_name }}
            **Target Platform:** Windows 10/11 x64

            ### Downloads
            - **Installer (EXE):** Single-click self-contained setup executable (`pixora-studio-*-installer.exe`).
            - **Installer (MSI):** Standard per-machine Windows installer package (`pixora-studio-*.msi`).
            - **Portable (ZIP):** Standalone zero-install archive. Run `photocraft.exe` directly; settings and recovery data remain in `PixoraStudioData/`.
            - **Checksums:** Verified SHA-256 hashes provided in `SHA256SUMS.txt`.

            ### Open Source & Licensing
            Pixora Studio is an independent open-source fork developed by IT Amadersomaj Inc. Dual-licensed under the MIT and Apache-2.0 licenses. See `LICENSES.md` and `ATTRIBUTION.md` for full copyright and third-party notices.
